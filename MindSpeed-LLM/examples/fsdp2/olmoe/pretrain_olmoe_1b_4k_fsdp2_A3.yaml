# OLMoE-1B-7B pretraining from scratch on Ascend NPU via MindSpeed FSDP2
# Model: OLMoE-1B-7B (64 experts, top-8 routing, 6.9B total / 1.3B active params)
# Data: FineWeb-edu 100BT tokenized with OLMoE tokenizer
# Hardware: 8x Ascend 910B2C NPUs
model:
  model_id: olmoe
  model_name_or_path: allenai/OLMoE-1B-7B-0924
  trust_remote_code: True
  train_from_scratch: True
  tokenizer_name_or_path: allenai/OLMoE-1B-7B-0924
  init_model_with_meta_device: True

data:
  dataset:
    file_name: "/data07/megatron_data/fineweb-edu_olmoe_text_document"
  cutoff_len: 4096
  data_manager_type: mg
  split: "100,0,0"
  dataloader_type: single
  create_attention_mask_in_dataloader: True
  reset_attention_mask: True
  append_eod: True

parallel:
  fsdp_size: 8
  fsdp_modules:
    - model.layers.{*}
    - model.embed_tokens
    - lm_head
  tp_size: 1
  ep_size: 1
  ep_modules:
    - model.layers.{*}.mlp.experts
  ep_fsdp_size: 1
  ep_fsdp_modules:
    - model.layers.{*}.mlp.experts
  ep_dispatcher: eager
  recompute: True
  recompute_modules:
    - model.layers.{*}
  reduce_dtype: bf16
  cp_size: 1
  cp_type: ulysses

training:
  stage: pt
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  dataloader_num_workers: 4
  disable_shuffling: True
  seed: 42
  dataloader_drop_last: True
  output_dir: ./output_olmoe
  optimizer: adamw
  lr: 4.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  min_lr: 1.0e-5
  num_train_epochs: 1.0
  max_steps: 100
  save_steps: 500
  logging_steps: 1

optimization:
  use_fused_rmsnorm: True
  use_fused_rotary_pos_emb: True
  moe_grouped_gemm: True
  use_flash_attn: True
